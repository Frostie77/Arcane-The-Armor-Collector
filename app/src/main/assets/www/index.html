<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Arcane: The Armor Collector</title>
<style>
  html,body { margin:0; width:100%; height:100%; overflow:hidden; background:#000; color:#ddd; font-family:sans-serif; }
  #stage { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; }
  #game { width:min(100vw, calc(100vh * 4 / 3)); height:min(100vh, calc(100vw * 3 / 4)); }
  ruffle-player { width:100%; height:100%; }
  #status { position:absolute; left:12px; bottom:12px; z-index:10; background:#181818cc; padding:8px 12px; font-size:14px; }
</style>
</head>
<body>
<div id="stage"><div id="game"></div></div>
<div id="status">Loading Arcane…</div>
<script>
window.RufflePlayer = window.RufflePlayer || {};
window.RufflePlayer.config = {
  autoplay: 'on',
  unmuteOverlay: 'visible',
  letterbox: 'on',
  contextMenu: 'off',
  allowNetworking: 'none',
  publicPath: 'ruffle/'
};
// Unified virtual mouse for the Odin controller. Flash aims using the
// canvas mouse position; the R2 trigger must use those SAME coordinates.
// Native Android touch dispatch made the aim jump when attacking.
const ARCANE_POINTER_ID = 10;
let arcaneControllerCanvas = null;
let arcaneVirtualButtonDown = false;
let arcaneWarnedNoCanvas = false;
const arcanePatchedCanvas = new WeakSet();

function arcaneGetControllerCanvas() {
  if (!arcanePlayer || arcaneInBackground) return null;
  const shadow = arcanePlayer.shadowRoot;
  if (!shadow) return null;
  const candidates = [...shadow.querySelectorAll('canvas')];
  const canvas = candidates
    .filter(e => e.getBoundingClientRect().width > 0 &&
                 e.getBoundingClientRect().height > 0)
    .sort((a, b) => {
      const ra = a.getBoundingClientRect();
      const rb = b.getBoundingClientRect();
      return rb.width * rb.height - ra.width * ra.height;
    })[0];
  if (!canvas && !arcaneWarnedNoCanvas) {
    console.warn('Arcane controller: Ruffle canvas unavailable');
    arcaneWarnedNoCanvas = true;
  }
  if (!canvas) return null;
  arcaneWarnedNoCanvas = false;
  if (!arcanePatchedCanvas.has(canvas)) {
    // Ruffle asks the browser to capture the pointer on pointerdown.
    // A synthetic pointer has no browser-side capture slot, so skip just
    // its capture/release calls. Never change real touchscreen capture.
    const capture = canvas.setPointerCapture.bind(canvas);
    const release = canvas.releasePointerCapture.bind(canvas);
    canvas.setPointerCapture = id => {
      if (id !== ARCANE_POINTER_ID) capture(id);
    };
    canvas.releasePointerCapture = id => {
      if (id !== ARCANE_POINTER_ID) release(id);
    };
    arcanePatchedCanvas.add(canvas);
  }
  return canvas;
}
function arcaneSendPointer(canvas, type, nx, ny) {
  const r = canvas.getBoundingClientRect();
  // Android normalizes against its WebView. The canvas may sit inside
  // a centred 4:3 area, so clamp to its visible bounds.
  const vx = Math.max(0, Math.min(window.innerWidth - 1, nx * window.innerWidth));
  const vy = Math.max(0, Math.min(window.innerHeight - 1, ny * window.innerHeight));
  const x = Math.max(r.left + 1, Math.min(r.right - 1, vx));
  const y = Math.max(r.top + 1, Math.min(r.bottom - 1, vy));
  const button = type === 'pointermove' ? -1 : 0;
  const buttons = type === 'pointerup' ? 0 :
                  (arcaneVirtualButtonDown ? 1 : 0);
  canvas.dispatchEvent(new PointerEvent(type, {
    bubbles: true, composed: true, cancelable: true,
    pointerType: 'mouse', pointerId: ARCANE_POINTER_ID, isPrimary: true,
    clientX: x, clientY: y, screenX: x, screenY: y,
    button, buttons, pressure: buttons ? 0.5 : 0
  }));
}
function arcanePointerEnter(canvas, nx, ny) {
  if (arcaneControllerCanvas !== canvas) {
    arcaneControllerCanvas = canvas;
    arcaneSendPointer(canvas, 'pointerenter', nx, ny);
    console.info('Arcane controller: virtual mouse connected to canvas');
  }
}
window.arcaneControllerAim = (nx, ny) => {
  const canvas = arcaneGetControllerCanvas();
  if (!canvas) return;
  arcanePointerEnter(canvas, nx, ny);
  arcaneSendPointer(canvas, 'pointermove', nx, ny);
};
window.arcaneControllerAttack = (nx, ny, pressed) => {
  const canvas = arcaneGetControllerCanvas();
  if (!canvas) return;
  arcanePointerEnter(canvas, nx, ny);
  // Aim BEFORE pressing to keep Ruffle's Flash mouse position in sync.
  arcaneSendPointer(canvas, 'pointermove', nx, ny);
  if (Boolean(pressed) === arcaneVirtualButtonDown) return;
  arcaneVirtualButtonDown = Boolean(pressed);
  arcaneSendPointer(canvas, pressed ? 'pointerdown' : 'pointerup', nx, ny);
  arcaneSendPointer(canvas, 'pointermove', nx, ny);
};
// Suspend Flash execution AND sound whenever the Android app is backgrounded.
let arcanePlayer = null;
let arcaneInBackground = false;
window.arcaneSuspend = () => {
  arcaneInBackground = true;
  if (arcanePlayer) {
    try { arcanePlayer.ruffle().suspend(); }
    catch (e) { if (typeof arcanePlayer.pause === 'function') arcanePlayer.pause(); }
  }
};
window.arcaneResume = () => {
  arcaneInBackground = false;
  if (arcanePlayer) {
    try { arcanePlayer.ruffle().resume(); }
    catch (e) { if (typeof arcanePlayer.play === 'function') arcanePlayer.play(); }
  }
};
document.addEventListener('visibilitychange', () => {
  if (document.hidden) window.arcaneSuspend();
  else window.arcaneResume();
});
window.addEventListener('pagehide', () => window.arcaneSuspend());
window.addEventListener('DOMContentLoaded', async () => {
  const status = document.getElementById('status');
  try {
    if (!window.RufflePlayer.newest) throw Error('Ruffle runtime missing. Run prepare.ps1 first.');
    const ruffle = window.RufflePlayer.newest();
    const player = ruffle.createPlayer();
    arcanePlayer = player;
    document.getElementById('game').appendChild(player);
    await player.ruffle().load({ url: 'arcane.swf' });
    if (arcaneInBackground || document.hidden) window.arcaneSuspend();
    status.remove();
    player.focus();
  } catch(e) {
    status.textContent = 'Could not load: ' + String(e);
    console.error(e);
  }
});
</script>
<script src="ruffle/ruffle.js"></script>
</body>
</html>
