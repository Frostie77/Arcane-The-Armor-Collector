<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Arcane: The Armor Collector</title>
<style>
  html,body { margin:0; width:100%; height:100%; overflow:hidden; background:#000; color:#ddd; font-family:sans-serif; }
  #stage { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; }
  #game { width:min(100vw, calc(100vh * 4 / 3)); height:min(100vh, calc(100vw * 3 / 4)); transform-origin:center center; }
  ruffle-player { width:100%; height:100%; }
  #status { position:absolute; left:12px; bottom:12px; z-index:10; background:#181818cc; padding:8px 12px; font-size:14px; }
</style>
</head>
<body>
<div id="stage"><div id="game"></div></div>
<div id="status">Loading Arcane…</div>
<script>
window.RufflePlayer = window.RufflePlayer || {};
window.RufflePlayer.config = {
  autoplay: 'on',
  unmuteOverlay: 'visible',
  letterbox: 'on',
  contextMenu: 'off',
  allowNetworking: 'none',
  publicPath: 'ruffle/'
};
// Display modes are CSS-only to keep the loaded Flash game running without
// resetting a round or losing progress. Arcane's SWF is 4:3, so "fill"
// preserves its shape but crops the top/bottom; stretch fills the viewport
// by altering the displayed aspect ratio.
let arcaneDisplayMode = 'original';
window.arcaneSetDisplayMode = (mode) => {
  if (!['original', 'fill', 'stretch'].includes(mode)) mode = 'original';
  arcaneDisplayMode = mode;
  const game = document.getElementById('game');
  const baseWidth = game.offsetWidth;
  const baseHeight = game.offsetHeight;
  if (baseWidth < 1 || baseHeight < 1) return;
  const viewportWidth = window.innerWidth;
  const viewportHeight = window.innerHeight;
  let sx = 1, sy = 1;
  if (mode === 'fill') {
    const factor = Math.max(viewportWidth / baseWidth, viewportHeight / baseHeight);
    sx = factor;
    sy = factor;
  } else if (mode === 'stretch') {
    sx = viewportWidth / baseWidth;
    sy = viewportHeight / baseHeight;
  }
  game.style.transform = 'scale(' + sx + ', ' + sy + ')';
  arcaneControllerCanvas = null;
  console.info('ArcaneAspectMode ' + mode + ' scale=(' +
    sx.toFixed(3) + ',' + sy.toFixed(3) + ')');
};
window.addEventListener('resize', () => window.arcaneSetDisplayMode(arcaneDisplayMode));
// Right-stick aiming from Android. Native WebView hover events do not always
// reach Ruffle, so deliver pointer motion to Ruffle's player directly.
// Coordinates are normalized against the Android WebView; map them into the
// browser viewport, including any 4:3 letterboxing.
// The Ruffle web runtime binds pointer events to its internal canvas,
// NOT to the outer <ruffle-player> web component. The canvas lives in
// Ruffle's open Shadow DOM. Send pointer movement to the actual canvas
// so Flash receives MouseMove even when the attack trigger is released.
let arcaneControllerCanvas = null;
let arcaneLastAimDiagnostic = 0;
let arcaneLastPointerDiagnostic = 0;
const arcaneInstrumentedCanvases = new WeakSet();
let arcaneWarnedNoCanvas = false;
window.arcaneControllerAim = (nx, ny) => {
  if (!arcanePlayer || arcaneInBackground || arcaneMenuPaused) return;
  const shadow = arcanePlayer.shadowRoot;
  const canvases = shadow ? Array.from(shadow.querySelectorAll('canvas')) : [];
  const canvas = canvases
    .filter(el => el.getBoundingClientRect().width > 0 &&
                  el.getBoundingClientRect().height > 0)
    .sort((a,b) => {
      const ra = a.getBoundingClientRect();
      const rb = b.getBoundingClientRect();
      return rb.width * rb.height - ra.width * ra.height;
    })[0];
  if (!canvas) {
    if (!arcaneWarnedNoCanvas) {
      console.warn('Arcane controller: Ruffle canvas not yet available');
      arcaneWarnedNoCanvas = true;
    }
    return;
  }
  arcaneWarnedNoCanvas = false;
  if (!arcaneInstrumentedCanvases.has(canvas)) {
    arcaneInstrumentedCanvases.add(canvas);
    // Log actual pointer coordinates, so we can compare aim vs R2
    // without guessing which coordinate system caused the jump.
    const logPointer = e => {
      const now = Date.now();
      if (now - arcaneLastPointerDiagnostic < 300) return;
      arcaneLastPointerDiagnostic = now;
      const rect = canvas.getBoundingClientRect();
      console.info('ArcaneAimDebug ' + e.type +
        ' kind=' + (e.pointerType || 'unknown') +
        ' trusted=' + e.isTrusted +
        ' client=(' + e.clientX.toFixed(1) + ',' + e.clientY.toFixed(1) + ')' +
        ' offset=(' + e.offsetX.toFixed(1) + ',' + e.offsetY.toFixed(1) + ')' +
        ' canvasRect=(' + rect.left.toFixed(1) + ',' + rect.top.toFixed(1) +
        ',' + rect.width.toFixed(1) + ',' + rect.height.toFixed(1) + ')');
    };
    canvas.addEventListener('pointerdown', logPointer, true);
    canvas.addEventListener('touchstart', e => {
      if (e.touches.length) {
        const p = e.touches[0];
        console.info('ArcaneAimDebug touchstart (' +
          p.clientX.toFixed(1) + ',' + p.clientY.toFixed(1) + ')');
      }
    }, {capture:true, passive:true});
  }
  const r = canvas.getBoundingClientRect();
  const viewX = Math.max(0, Math.min(window.innerWidth - 1, nx * window.innerWidth));
  const viewY = Math.max(0, Math.min(window.innerHeight - 1, ny * window.innerHeight));
  const x = Math.max(r.left + 1, Math.min(r.right - 1, viewX));
  const y = Math.max(r.top + 1, Math.min(r.bottom - 1, viewY));
  if (typeof PointerEvent === 'function') {
    const options = {
      bubbles: true, composed: true, cancelable: true,
      pointerType: 'mouse', pointerId: 10, isPrimary: true,
      clientX: x, clientY: y, screenX: x, screenY: y,
      button: -1, buttons: 0, pressure: 0
    };
    if (arcaneControllerCanvas !== canvas) {
      arcaneControllerCanvas = canvas;
      canvas.dispatchEvent(new PointerEvent('pointerenter', options));
      console.info('Arcane controller: aiming at Ruffle canvas');
    }
    const synthetic = new PointerEvent('pointermove', options);
    // Android WebView reports offsetX/Y for synthetic PointerEvents in
    // a different scale than for genuine touch events. Ruffle reads
    // offsetX/Y, not clientX/Y. Supply canvas-local CSS coordinates
    // explicitly to make stick aim and R2 use identical game positions.
    // The player can be CSS-scaled for widescreen display. Chromium's
    // genuine touch events report offsetX/Y in the *untransformed* element
    // coordinates; mirror that conversion for synthetic right-stick input.
    const localX = (x - r.left) * canvas.offsetWidth / Math.max(1, r.width);
    const localY = (y - r.top) * canvas.offsetHeight / Math.max(1, r.height);
    try {
      Object.defineProperties(synthetic, {
        offsetX: { configurable: true, value: localX },
        offsetY: { configurable: true, value: localY }
      });
    } catch (error) {
      console.warn('Arcane controller: could not normalize pointer offsets', error);
    }
    canvas.dispatchEvent(synthetic);
    if (Date.now() - arcaneLastAimDiagnostic > 1000) {
      arcaneLastAimDiagnostic = Date.now();
      console.info('ArcaneAimDebug aim=' +
        '(' + x.toFixed(1) + ',' + y.toFixed(1) + ')' +
        ' offset=(' + synthetic.offsetX.toFixed(1) +
        ',' + synthetic.offsetY.toFixed(1) + ')' +
        ' targetOffset=(' + localX.toFixed(1) + ',' + localY.toFixed(1) + ')' +
        ' canvasRect=(' + r.left.toFixed(1) + ',' + r.top.toFixed(1) +
        ',' + r.width.toFixed(1) + ',' + r.height.toFixed(1) + ')');
    }
  } else {
    canvas.dispatchEvent(new MouseEvent('mousemove', {
      bubbles: true, composed: true, cancelable: true,
      clientX: x, clientY: y, screenX: x, screenY: y,
      buttons: 0
    }));
  }
};
// Ruffle can miss Android WebView's key-up when focus changes.
// A key-down/up pair clears stale movement in the Flash game, but W is
// Arcane's JUMP command: never synthesize a W press during recovery.
// Use release-only for W; tap A/S/D to clear their stuck states.
window.arcaneClearMovementKeys = () => {
  if (!arcanePlayer || arcaneInBackground) return;
  try {
    arcanePlayer.focus();
    const send = (type, key, code, keyCode) => {
      arcanePlayer.dispatchEvent(new KeyboardEvent(type, {
        key, code, keyCode, which: keyCode,
        bubbles: true, composed: true, cancelable: true,
        repeat: false
      }));
    };
    send('keyup', 'w', 'KeyW', 87);
    for (const [key, code, keyCode] of [
      ['a', 'KeyA', 65], ['s', 'KeyS', 83], ['d', 'KeyD', 68]
    ]) {
      send('keydown', key, code, keyCode);
      send('keyup', key, code, keyCode);
    }
    console.info('ArcaneMovementRecovery: W release; A/S/D down-up');
  } catch (error) {
    console.warn('ArcaneMovementRecovery: failed', error);
  }
};
// Pause Flash execution and sound while the options overlay is visible
// OR Android backgrounds the activity. Either reason independently keeps
// Ruffle paused, so returning to the app never resumes an open pause menu.
let arcanePlayer = null;
let arcaneInBackground = false;
let arcaneMenuPaused = false;
let arcaneRufflePaused = false;
const arcaneSyncPausedState = () => {
  const shouldPause = arcaneInBackground || arcaneMenuPaused;
  if (!arcanePlayer || shouldPause === arcaneRufflePaused) return;
  try {
    if (shouldPause) arcanePlayer.ruffle().suspend();
    else arcanePlayer.ruffle().resume();
    arcaneRufflePaused = shouldPause;
  } catch (e) {
    try {
      if (shouldPause && typeof arcanePlayer.pause === 'function') arcanePlayer.pause();
      else if (!shouldPause && typeof arcanePlayer.play === 'function') arcanePlayer.play();
      arcaneRufflePaused = shouldPause;
    } catch (fallbackError) {
      console.warn('Arcane pause failed', fallbackError);
    }
  }
};
window.arcaneSuspend = () => {
  arcaneInBackground = true;
  arcaneSyncPausedState();
};
window.arcaneResume = () => {
  arcaneInBackground = false;
  arcaneSyncPausedState();
};
window.arcaneSetMenuPaused = (paused) => {
  const next = !!paused;
  if (next === arcaneMenuPaused) return;
  // Clear held movement before suspending, then once again when resuming.
  if (next && typeof window.arcaneClearMovementKeys === 'function')
    window.arcaneClearMovementKeys();
  arcaneMenuPaused = next;
  arcaneSyncPausedState();
  if (!next && !arcaneInBackground && typeof window.arcaneClearMovementKeys === 'function')
    window.arcaneClearMovementKeys();
  console.info('ArcaneOptions: ' + (next ? 'paused' : 'resumed'));
};
document.addEventListener('visibilitychange', () => {
  if (document.hidden) window.arcaneSuspend();
  else window.arcaneResume();
});
window.addEventListener('pagehide', () => window.arcaneSuspend());
window.addEventListener('DOMContentLoaded', async () => {
  const status = document.getElementById('status');
  try {
    if (!window.RufflePlayer.newest) throw Error('Ruffle runtime missing. Run prepare.ps1 first.');
    const ruffle = window.RufflePlayer.newest();
    const player = ruffle.createPlayer();
    arcanePlayer = player;
    // The Android wrapper adds FSCommand scene markers to the local SWF in
    // memory, without altering it on disk. Frame 20 is arena gameplay,
    // while the other main timeline frames are menus / equipment / results.
    player.onFSCommand = (command, args) => {
      if (command !== 'arcanePhase') return;
      const phase = args === 'arena' ? 'arena' : 'menu';
      console.info('ArcanePhase: ' + phase);
      try {
        if (window.ArcaneHost && typeof window.ArcaneHost.reportPhase === 'function')
          window.ArcaneHost.reportPhase(phase);
      } catch (e) {
        console.warn('ArcanePhase: failed to report scene', e);
      }
    };
    document.getElementById('game').appendChild(player);
    await player.ruffle().load({ url: 'arcane.swf' });
    if (arcaneInBackground || document.hidden) window.arcaneSuspend();
    else arcaneSyncPausedState();
    status.remove();
    player.focus();
  } catch(e) {
    status.textContent = 'Could not load: ' + String(e);
    console.error(e);
  }
});
</script>
<script src="ruffle/ruffle.js"></script>
</body>
</html>
