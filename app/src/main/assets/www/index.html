<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Arcane: The Armor Collector</title>
<style>
  html,body { margin:0; width:100%; height:100%; overflow:hidden; background:#000; color:#ddd; font-family:sans-serif; }
  #stage { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; }
  #game { width:min(100vw, calc(100vh * 4 / 3)); height:min(100vh, calc(100vw * 3 / 4)); }
  ruffle-player { width:100%; height:100%; }
  #status { position:absolute; left:12px; bottom:12px; z-index:10; background:#181818cc; padding:8px 12px; font-size:14px; }
</style>
</head>
<body>
<div id="stage"><div id="game"></div></div>
<div id="status">Loading Arcane…</div>
<script>
window.RufflePlayer = window.RufflePlayer || {};
window.RufflePlayer.config = {
  autoplay: 'on',
  unmuteOverlay: 'visible',
  letterbox: 'on',
  contextMenu: 'off',
  allowNetworking: 'none',
  publicPath: 'ruffle/'
};
// Right-stick aiming from Android. Native WebView hover events do not always
// reach Ruffle, so deliver pointer motion to Ruffle's player directly.
// Coordinates are normalized against the Android WebView; map them into the
// browser viewport, including any 4:3 letterboxing.
// The Ruffle web runtime binds pointer events to its internal canvas,
// NOT to the outer <ruffle-player> web component. The canvas lives in
// Ruffle's open Shadow DOM. Send pointer movement to the actual canvas
// so Flash receives MouseMove even when the attack trigger is released.
let arcaneControllerCanvas = null;
let arcaneWarnedNoCanvas = false;
window.arcaneControllerAim = (nx, ny) => {
  if (!arcanePlayer || arcaneInBackground) return;
  const shadow = arcanePlayer.shadowRoot;
  const canvases = shadow ? Array.from(shadow.querySelectorAll('canvas')) : [];
  const canvas = canvases
    .filter(el => el.getBoundingClientRect().width > 0 &&
                  el.getBoundingClientRect().height > 0)
    .sort((a,b) => {
      const ra = a.getBoundingClientRect();
      const rb = b.getBoundingClientRect();
      return rb.width * rb.height - ra.width * ra.height;
    })[0];
  if (!canvas) {
    if (!arcaneWarnedNoCanvas) {
      console.warn('Arcane controller: Ruffle canvas not yet available');
      arcaneWarnedNoCanvas = true;
    }
    return;
  }
  arcaneWarnedNoCanvas = false;
  const r = canvas.getBoundingClientRect();
  const viewX = Math.max(0, Math.min(window.innerWidth - 1, nx * window.innerWidth));
  const viewY = Math.max(0, Math.min(window.innerHeight - 1, ny * window.innerHeight));
  const x = Math.max(r.left + 1, Math.min(r.right - 1, viewX));
  const y = Math.max(r.top + 1, Math.min(r.bottom - 1, viewY));
  if (typeof PointerEvent === 'function') {
    const options = {
      bubbles: true, composed: true, cancelable: true,
      pointerType: 'mouse', pointerId: 10, isPrimary: true,
      clientX: x, clientY: y, screenX: x, screenY: y,
      button: -1, buttons: 0, pressure: 0
    };
    if (arcaneControllerCanvas !== canvas) {
      arcaneControllerCanvas = canvas;
      canvas.dispatchEvent(new PointerEvent('pointerenter', options));
      console.info('Arcane controller: aiming at Ruffle canvas');
    }
    canvas.dispatchEvent(new PointerEvent('pointermove', options));
  } else {
    canvas.dispatchEvent(new MouseEvent('mousemove', {
      bubbles: true, composed: true, cancelable: true,
      clientX: x, clientY: y, screenX: x, screenY: y,
      buttons: 0
    }));
  }
};
// Suspend Flash execution AND sound whenever the Android app is backgrounded.
let arcanePlayer = null;
let arcaneInBackground = false;
window.arcaneSuspend = () => {
  arcaneInBackground = true;
  if (arcanePlayer) {
    try { arcanePlayer.ruffle().suspend(); }
    catch (e) { if (typeof arcanePlayer.pause === 'function') arcanePlayer.pause(); }
  }
};
window.arcaneResume = () => {
  arcaneInBackground = false;
  if (arcanePlayer) {
    try { arcanePlayer.ruffle().resume(); }
    catch (e) { if (typeof arcanePlayer.play === 'function') arcanePlayer.play(); }
  }
};
document.addEventListener('visibilitychange', () => {
  if (document.hidden) window.arcaneSuspend();
  else window.arcaneResume();
});
window.addEventListener('pagehide', () => window.arcaneSuspend());
window.addEventListener('DOMContentLoaded', async () => {
  const status = document.getElementById('status');
  try {
    if (!window.RufflePlayer.newest) throw Error('Ruffle runtime missing. Run prepare.ps1 first.');
    const ruffle = window.RufflePlayer.newest();
    const player = ruffle.createPlayer();
    arcanePlayer = player;
    document.getElementById('game').appendChild(player);
    await player.ruffle().load({ url: 'arcane.swf' });
    if (arcaneInBackground || document.hidden) window.arcaneSuspend();
    status.remove();
    player.focus();
  } catch(e) {
    status.textContent = 'Could not load: ' + String(e);
    console.error(e);
  }
});
</script>
<script src="ruffle/ruffle.js"></script>
</body>
</html>
