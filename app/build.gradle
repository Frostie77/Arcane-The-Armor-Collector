plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.arcanearmorcollector.android'
    compileSdk 35

    defaultConfig {
        applicationId 'io.github.arcanearmorcollector.android'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '0.2.0-rc2'
    }
    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    // Some WebAssembly assets exceed Android's normal compression threshold.
    androidResources {
        noCompress += ['swf', 'wasm']
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.13.0'
}
