plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.arcanearmorcollector.android'
    compileSdk 35

    defaultConfig {
        applicationId 'io.github.arcanearmorcollector.android'
        minSdk 26
        targetSdk 35
        versionCode 17
        versionName '0.2.1'
    }
    buildTypes {
        debug {
            // A side-by-side first-run import test never touches the user's
            // existing Arcane Debug APK, installed data or Arcane8 saves.
            if (project.hasProperty('arcaneImportTest')) {
                applicationIdSuffix '.importtest'
                versionNameSuffix '-importtest'
            } else {
                versionNameSuffix '-dev'
            }
        }
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    // Some WebAssembly assets exceed Android's normal compression threshold.
    androidResources {
        noCompress += ['swf', 'wasm']
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.13.0'
    implementation project(':frostfrontend')
}
